# Tema alinhado à interface compacta do CardioAmostra.
[theme]
base = "light"
primaryColor = "#9E3151"
backgroundColor = "#FAF9F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#223236"
linkColor = "#9E3151"
borderColor = "#E4E3DF"
dataframeBorderColor = "#E4E3DF"
dataframeHeaderBackgroundColor = "#FAF9F6"
showWidgetBorder = true
baseRadius = "6px"
font = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAF9F6"
borderColor = "#E4E3DF"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
