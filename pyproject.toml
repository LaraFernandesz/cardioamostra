[project]
name = "cardioamostra"
version = "0.1.0"
description = "Como técnicas de amostragem mudam a detecção de doença cardíaca"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "imbalanced-learn>=0.14",
    "matplotlib>=3.7",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "jupyter", "nbconvert", "ucimlrepo", "kaggle"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]  # o notebook ajusta o sys.path antes de importar o pacote

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
